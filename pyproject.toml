[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwsim-hazop-bridge"
version = "1.2.0"
description = "Automated closed-loop HAZOP screening and mitigation framework for DWSIM chemical process flowsheets."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "requests>=2.28.0",
    "openpyxl>=3.0.0",
    "pythonnet>=3.0.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
